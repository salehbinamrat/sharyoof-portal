name = "sharyoof"
# Preserve production secrets configured in the Cloudflare runtime dashboard.
keep_vars = true
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "sharyoof-portal-db"
database_id = "35cbf68e-23e5-4a86-bc08-7e3770fa4fca"

[vars]
ADMIN_USER = "admin"
GH_REPO = "salehbinamrat/sharyoof-portal"
