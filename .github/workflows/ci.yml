name: Sharyoof Portal CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  site-core:
    name: Site Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
  site-release:
    name: Site Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist-worker
  deploy:
    name: Deploy to Cloudflare
    needs: [site-core,site-release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate deployment settings
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo 'Configure D1 database_id first'; exit 1
          fi
      - name: Validate GitHub Actions Cloudflare credentials
        env:
          CF_API_TOKEN_AVAILABLE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CF_ACCOUNT_ID_AVAILABLE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_API_TOKEN_AVAILABLE" != "true" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN in GitHub Actions repository secrets"; exit 1
          fi
          if [ "$CF_ACCOUNT_ID_AVAILABLE" != "true" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID in GitHub Actions repository secrets"; exit 1
          fi
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
